<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슬레이어 키우기 - 방치형 RPG</title>
    <!-- 가장 안정적인 Phaser 3 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            user-select: none;
        }
    </style>
</head>
<body>

<script>
// --- 1. 게임 전역 데이터 (단 1번만 선언) ---
const gameState = {
    gold: 0,
    atk: 5,             // 주인공 공격력
    atkCost: 10,        // 공격력 강화 비용
    atkSpeed: 800,      // 공격 속도 (ms 단위)
    stage: 1,           // 현재 스테이지
    killCount: 0,       // 현재 스테이지 처치 수
    maxKills: 5         // 다음 스테이지 진입에 필요한 처치 수
};

// --- 2. 메인 게임 씬 ---
class MainScene extends Phaser.Scene {
    constructor() {
        super({ key: 'MainScene' });
    }

    create() {
        // [배경 영역 분리]
        this.add.rectangle(200, 200, 400, 400, 0x1e1e24); // 상단 전투 필드
        this.add.rectangle(200, 500, 400, 200, 0x2b2d42); // 하단 UI 영역

        // [UI 텍스트 세팅]
        this.stageText = this.add.text(200, 25, `STAGE ${gameState.stage} (${gameState.killCount}/${gameState.maxKills})`, { fontSize: '20px', fill: '#00e676', fontStyle: 'bold' }).setOrigin(0.5);
        this.goldText = this.add.text(20, 60, `골드: ${gameState.gold} G`, { fontSize: '18px', fill: '#ffd700', fontStyle: 'bold' });
        this.atkText = this.add.text(20, 85, `공격력: ${gameState.atk}`, { fontSize: '15px', fill: '#ffffff' });

        // [주인공 슬레이어 (파란색 박스)]
        this.player = this.add.rectangle(80, 240, 35, 35, 0x29b6f6);
        this.add.text(80, 210, "슬레이어", { fontSize: '12px', fill: '#ffffff' }).setOrigin(0.5);

        // [첫 번째 몬스터 생성]
        this.spawnMonster();

        // [자동 공격 타이머 등록]
        this.attackTimer = this.time.addEvent({
            delay: gameState.atkSpeed,
            callback: this.autoAttack,
            callbackScope: this,
            loop: true
        });

        // [하단 공격력 강화 버튼]
        this.btnAtkUpgrade = this.add.rectangle(200, 480, 360, 50, 0xd90429).setInteractive({ useHandCursor: true });
        this.textAtkUpgrade = this.add.text(200, 480, `공격력 강화 (+2) - ${gameState.atkCost} G`, { fontSize: '16px', fill: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);

        // 강화 버튼 클릭 처리
        this.btnAtkUpgrade.on('pointerdown', () => {
            if (gameState.gold >= gameState.atkCost) {
                gameState.gold -= gameState.atkCost;
                gameState.atk += 2;
                gameState.atkCost = Math.floor(gameState.atkCost * 1.5);
                this.updateUI();

                // 버튼 누름 피드백 애니메이션
                this.tweens.add({
                    targets: this.btnAtkUpgrade,
                    scaleX: 0.95,
                    scaleY: 0.95,
                    duration: 50,
                    yoyo: true
                });
            }
        });
    }

    // 몬스터 생성 기능
    spawnMonster() {
        const hp = gameState.stage * 15;
        this.currentMonster = {
            sprite: this.add.rectangle(280, 240, 40, 40, 0xef233c),
            hp: hp,
            maxHp: hp,
            hpText: this.add.text(280, 210, `HP: ${hp}`, { fontSize: '12px', fill: '#ff8a80' }).setOrigin(0.5)
        };
    }

    // 주인공 자동 공격 메커니즘
    autoAttack() {
        if (!this.currentMonster || this.currentMonster.hp <= 0) return;

        // 검기 투사체 생성 및 이동
        const slash = this.add.rectangle(this.player.x + 20, this.player.y, 20, 6, 0x00e5ff);
        
        this.tweens.add({
            targets: slash,
            x: this.currentMonster.sprite.x,
            duration: 120,
            onComplete: () => {
                slash.destroy();
                this.damageMonster(gameState.atk);
            }
        });
    }

    // 데미지 계산 및 이펙트
    damageMonster(amount) {
        if (!this.currentMonster) return;

        this.currentMonster.hp -= amount;

        // 데미지 텍스트 팝업
        const dmgText = this.add.text(this.currentMonster.sprite.x + Phaser.Math.Between(-10, 10), 180, `-${amount}`, { fontSize: '18px', fill: '#ffeb3b', fontStyle: 'bold' }).setOrigin(0.5);
        this.tweens.add({
            targets: dmgText,
            y: 140,
            alpha: 0,
            duration: 400,
            onComplete: () => dmgText.destroy()
        });

        // 몬스터 체력 처리
        if (this.currentMonster.hp > 0) {
            this.currentMonster.hpText.setText(`HP: ${this.currentMonster.hp}`);
        } else {
            this.killMonster();
        }

        this.updateUI();
    }

    // 몬스터 처치 및 다음 몬스터 처리
    killMonster() {
        gameState.gold += gameState.stage * 8;
        gameState.killCount += 1;

        if (this.currentMonster) {
            this.currentMonster.sprite.destroy();
            this.currentMonster.hpText.destroy();
            this.currentMonster = null;
        }

        // 스테이지 상승 체크
        if (gameState.killCount >= gameState.maxKills) {
            gameState.stage += 1;
            gameState.killCount = 0;
        }

        this.updateUI();

        // 0.3초 후 다음 몬스터 스폰
        this.time.delayedCall(300, () => {
            this.spawnMonster();
        });
    }

    // UI 동기화
    updateUI() {
        this.stageText.setText(`STAGE ${gameState.stage} (${gameState.killCount}/${gameState.maxKills})`);
        this.goldText.setText(`골드: ${gameState.gold} G`);
        this.atkText.setText(`공격력: ${gameState.atk}`);
        this.textAtkUpgrade.setText(`공격력 강화 (+2) - ${gameState.atkCost} G`);
    }
}

// --- 3. Phaser 실행 설정 ---
const config = {
    type: Phaser.AUTO,
    width: 400,
    height: 600,
    backgroundColor: '#0d0d11',
    scene: MainScene,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    }
};

const game = new Phaser.Game(config);
</script>

</body>
</html>
