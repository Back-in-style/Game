<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환생용사 방치하기 - Phaser 3 RPG</title>
    <!-- Phaser 3 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            user-select: none;
        }
    </style>
</head>
<body>

<script>
// --- 1. 게임 전역 데이터 구조 ---
const gameState = {
    // [휘발성 재화 및 일반 레벨] (환생 시 초기화)
    gold: 0,
    atkLevel: 1,            // 일반 공격력 레벨
    critRateLevel: 0,       // 일반 치명타 확률 레벨
    atkSpeedLevel: 0,       // 일반 공격속도 레벨
    
    stage: 1,               // 현재 스테이지
    killCount: 0,           // 현재 스테이지 처치 수
    maxKills: 5,            // 다음 스테이지 진입 처치 수

    // [영구 재화 및 영구 버프] (환생해도 유지)
    rebirthStone: 0,        // 보유 환생석
    permAtkLevel: 0,        // 영구 공격력 레벨 (+10% / 레벨)
    permGoldLevel: 0,       // 영구 골드 레벨 (+15% / 레벨)

    // UI 상태
    currentTab: 'normal',   // 'normal' 또는 'rebirth'

    // [기본 수치]
    baseAtk: 5,
    baseCritRate: 10,
    baseCritDmg: 150,
    baseAtkSpeed: 800
};

// --- [계산식 보조 함수들] ---
function getAtkCost() { return Math.floor(10 * Math.pow(1.12, gameState.atkLevel - 1)); }
function getCritCost() { return Math.floor(20 * Math.pow(1.6, gameState.critRateLevel)); }
function getSpdCost() { return Math.floor(30 * Math.pow(1.7, gameState.atkSpeedLevel)); }

// 영구 강화 비용 (환생석)
function getPermAtkCost() { return Math.floor(1 * Math.pow(1.5, gameState.permAtkLevel)); }
function getPermGoldCost() { return Math.floor(1 * Math.pow(1.5, gameState.permGoldLevel)); }

// 최종 수치 계산식
function getFinalAtk() {
    const normalAtk = gameState.baseAtk + (gameState.atkLevel - 1) * 2;
    const permBuff = 1 + (gameState.permAtkLevel * 0.10);
    return Math.floor(normalAtk * permBuff);
}
function getFinalCritRate() { return Math.min(100, gameState.baseCritRate + gameState.critRateLevel); }
function getFinalAtkSpeed() { return Math.max(100, gameState.baseAtkSpeed - (gameState.atkSpeedLevel * 30)); }

function getMonsterMaxHp(stage) { return Math.floor(15 * Math.pow(1.15, stage - 1)); }
function getMonsterGold(stage) {
    const baseGold = stage * 8;
    const permBuff = 1 + (gameState.permGoldLevel * 0.15);
    return Math.floor(baseGold * permBuff);
}
function getRebirthReward() {
    if (gameState.stage < 10) return 0;
    return Math.floor(Math.pow(gameState.stage / 10, 1.5));
}


// --- 2. 메인 게임 씬 ---
class MainScene extends Phaser.Scene {
    constructor() {
        super({ key: 'MainScene' });
    }

    create() {
        // [1] 배경 영역
        this.add.rectangle(200, 140, 400, 280, 0x1e1e24); // 상단 전투 필드
        this.add.rectangle(200, 440, 400, 320, 0x2b2d42); // 하단 UI 영역

        // [2] 상단 UI 텍스트
        this.stageText = this.add.text(200, 15, '', { fontSize: '18px', fill: '#00e676', fontStyle: 'bold' }).setOrigin(0.5);
        this.goldText = this.add.text(20, 40, '', { fontSize: '15px', fill: '#ffd700', fontStyle: 'bold' });
        this.rebirthStoneText = this.add.text(20, 60, '', { fontSize: '15px', fill: '#e040fb', fontStyle: 'bold' });
        
        // [3] 스탯 정보 텍스트
        this.atkText = this.add.text(20, 82, '', { fontSize: '12px', fill: '#ffffff' });
        this.critText = this.add.text(20, 98, '', { fontSize: '12px', fill: '#ffeb3b' });
        this.spdText = this.add.text(20, 114, '', { fontSize: '12px', fill: '#00e5ff' });

        // [4] 주인공 용사
        this.player = this.add.rectangle(80, 200, 35, 35, 0x29b6f6);
        this.add.text(80, 170, "용사", { fontSize: '12px', fill: '#ffffff' }).setOrigin(0.5);

        // --- [5] 하단 탭 버튼 (일반 강화 vs 환생/영구 강화) ---
        this.tabNormalBtn = this.add.rectangle(100, 295, 190, 30, 0x3d405b).setInteractive({ useHandCursor: true });
        this.tabNormalText = this.add.text(100, 295, "⚔️ 일반 강화", { fontSize: '14px', fill: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);

        this.tabRebirthBtn = this.add.rectangle(300, 295, 190, 30, 0x3d405b).setInteractive({ useHandCursor: true });
        this.tabRebirthText = this.add.text(300, 295, "🌀 환생 & 영구강화", { fontSize: '14px', fill: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);

        this.tabNormalBtn.on('pointerdown', () => { gameState.currentTab = 'normal'; this.updateUI(); });
        this.tabRebirthBtn.on('pointerdown', () => { gameState.currentTab = 'rebirth'; this.updateUI(); });

        // --- [6] 강화 버튼 그룹 생성 ---

        // A. 일반 강화 버튼 3종
        this.btnAtkUpgrade = this.add.rectangle(200, 350, 360, 40, 0xd90429).setInteractive({ useHandCursor: true });
        this.textAtkUpgrade = this.add.text(200, 350, '', { fontSize: '14px', fill: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
        this.btnAtkUpgrade.on('pointerdown', () => {
            const cost = getAtkCost();
            if (gameState.gold >= cost) {
                gameState.gold -= cost;
                gameState.atkLevel += 1;
                this.updateUI();
                this.playBtnTween(this.btnAtkUpgrade);
            }
        });

        this.btnCritUpgrade = this.add.rectangle(200, 400, 360, 40, 0xf77f00).setInteractive({ useHandCursor: true });
        this.textCritUpgrade = this.add.text(200, 400, '', { fontSize: '14px', fill: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
        this.btnCritUpgrade.on('pointerdown', () => {
            if (getFinalCritRate() >= 100) return;
            const cost = getCritCost();
            if (gameState.gold >= cost) {
                gameState.gold -= cost;
                gameState.critRateLevel += 1;
                this.updateUI();
                this.playBtnTween(this.btnCritUpgrade);
            }
        });

        this.btnSpdUpgrade = this.add.rectangle(200, 450, 360, 40, 0x00b4d8).setInteractive({ useHandCursor: true });
        this.textSpdUpgrade = this.add.text(200, 450, '', { fontSize: '14px', fill: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
        this.btnSpdUpgrade.on('pointerdown', () => {
            if (getFinalAtkSpeed() <= 100) return;
            const cost = getSpdCost();
            if (gameState.gold >= cost) {
                gameState.gold -= cost;
                gameState.atkSpeedLevel += 1;
                this.startAutoAttackTimer();
                this.updateUI();
                this.playBtnTween(this.btnSpdUpgrade);
            }
        });

        // B. 환생 & 영구 강화 버튼 그룹
        this.btnPermAtkUpgrade = this.add.rectangle(200, 350, 360, 40, 0x7209b7).setInteractive({ useHandCursor: true });
        this.textPermAtkUpgrade = this.add.text(200, 350, '', { fontSize: '14px', fill: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
        this.btnPermAtkUpgrade.on('pointerdown', () => {
            const cost = getPermAtkCost();
            if (gameState.rebirthStone >= cost) {
                gameState.rebirthStone -= cost;
                gameState.permAtkLevel += 1;
                this.updateUI();
                this.playBtnTween(this.btnPermAtkUpgrade);
            }
        });

        this.btnPermGoldUpgrade = this.add.rectangle(200, 400, 360, 40, 0x3a0ca3).setInteractive({ useHandCursor: true });
        this.textPermGoldUpgrade = this.add.text(200, 400, '', { fontSize: '14px', fill: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
        this.btnPermGoldUpgrade.on('pointerdown', () => {
            const cost = getPermGoldCost();
            if (gameState.rebirthStone >= cost) {
                gameState.rebirthStone -= cost;
                gameState.permGoldLevel += 1;
                this.updateUI();
                this.playBtnTween(this.btnPermGoldUpgrade);
            }
        });

        this.btnRebirth = this.add.rectangle(200, 520, 360, 50, 0xaa00ff).setInteractive({ useHandCursor: true });
        this.textRebirth = this.add.text(200, 520, '', { fontSize: '15px', fill: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
        this.btnRebirth.on('pointerdown', () => { this.executeRebirth(); });

        // 시작 실행
        this.updateUI();
        this.spawnMonster();
        this.startAutoAttackTimer();
    }

    // 환생 처리
    executeRebirth() {
        const reward = getRebirthReward();
        if (reward <= 0) {
            alert("환생하려면 최소 10 스테이지 이상 도달해야 합니다!");
            return;
        }

        if (confirm(`환생하시겠습니까?\n\n[환생 보상]: 환생석 +${reward}개\n* 스테이지, 골드, 일반 강화 레벨이 초기화됩니다.`)) {
            gameState.rebirthStone += reward;

            // 휘발성 데이터 초기화
            gameState.gold = 0;
            gameState.atkLevel = 1;
            gameState.critRateLevel = 0;
            gameState.atkSpeedLevel = 0;
            gameState.stage = 1;
            gameState.killCount = 0;

            if (this.currentMonster) {
                this.currentMonster.sprite.destroy();
                this.currentMonster.hpText.destroy();
                this.currentMonster = null;
            }

            this.startAutoAttackTimer();
            this.updateUI();
            this.spawnMonster();
            this.playBtnTween(this.btnRebirth);
        }
    }

    startAutoAttackTimer() {
        if (this.attackTimer) {
            this.attackTimer.remove(false);
            this.attackTimer = null;
        }
        this.attackTimer = this.time.addEvent({
            delay: getFinalAtkSpeed(),
            callback: this.autoAttack,
            callbackScope: this,
            loop: true
        });
    }

    playBtnTween(target) {
        this.tweens.add({
            targets: target,
            scaleX: 0.95,
            scaleY: 0.95,
            duration: 50,
            yoyo: true
        });
    }

    spawnMonster() {
        const hp = getMonsterMaxHp(gameState.stage);
        this.currentMonster = {
            sprite: this.add.rectangle(280, 200, 40, 40, 0xef233c),
            hp: hp,
            maxHp: hp,
            hpText: this.add.text(280, 170, `HP: ${hp}`, { fontSize: '12px', fill: '#ff8a80' }).setOrigin(0.5)
        };
    }

    autoAttack() {
        if (!this.currentMonster || this.currentMonster.hp <= 0) return;

        const isCrit = (Math.random() * 100) < getFinalCritRate();
        let finalDamage = getFinalAtk();
        
        if (isCrit) {
            finalDamage = Math.floor(finalDamage * (gameState.baseCritDmg / 100));
        }

        const slashColor = isCrit ? 0xffea00 : 0x00e5ff;
        const slash = this.add.rectangle(this.player.x + 20, this.player.y, 20, 6, slashColor);
        
        this.tweens.add({
            targets: slash,
            x: this.currentMonster.sprite.x,
            duration: 100,
            onComplete: () => {
                slash.destroy();
                this.damageMonster(finalDamage, isCrit);
            }
        });
    }

    damageMonster(amount, isCrit) {
        if (!this.currentMonster) return;

        this.currentMonster.hp -= amount;

        const dmgColor = isCrit ? '#ff1744' : '#ffeb3b';
        const dmgTextStr = isCrit ? `💥 ${amount}!` : `-${amount}`;
        const fontSize = isCrit ? '22px' : '16px';

        const dmgText = this.add.text(
            this.currentMonster.sprite.x + Math.floor(Math.random() * 20 - 10), 
            140, 
            dmgTextStr, 
            { fontSize: fontSize, fill: dmgColor, fontStyle: 'bold' }
        ).setOrigin(0.5);

        this.tweens.add({
            targets: dmgText,
            y: 100,
            alpha: 0,
            duration: isCrit ? 600 : 400,
            onComplete: () => dmgText.destroy()
        });

        if (this.currentMonster.hp > 0) {
            this.currentMonster.hpText.setText(`HP: ${this.currentMonster.hp}`);
        } else {
            this.killMonster();
        }

        this.updateUI();
    }

    killMonster() {
        gameState.gold += getMonsterGold(gameState.stage);
        gameState.killCount += 1;

        if (this.currentMonster) {
            this.currentMonster.sprite.destroy();
            this.currentMonster.hpText.destroy();
            this.currentMonster = null;
        }

        if (gameState.killCount >= gameState.maxKills) {
            gameState.stage += 1;
            gameState.killCount = 0;
        }

        this.updateUI();

        this.time.delayedCall(200, () => {
            this.spawnMonster();
        });
    }

    updateUI() {
        if (!this.stageText) return;

        // 상단 스탯
        this.stageText.setText(`STAGE ${gameState.stage} (${gameState.killCount}/${gameState.maxKills})`);
        this.goldText.setText(`골드: ${gameState.gold.toLocaleString()} G`);
        this.rebirthStoneText.setText(`환생석: ${gameState.rebirthStone.toLocaleString()} 개`);

        this.atkText.setText(`공격력: ${getFinalAtk()} (일반 Lv.${gameState.atkLevel} / 영구 +${gameState.permAtkLevel * 10}%)`);
        this.critText.setText(`치명타: ${getFinalCritRate()}% (Lv.${gameState.critRateLevel})`);
        this.spdText.setText(`공격속도: ${(1000 / getFinalAtkSpeed()).toFixed(2)}회/초 (Lv.${gameState.atkSpeedLevel})`);

        // 탭 스타일 전환
        if (gameState.currentTab === 'normal') {
            this.tabNormalBtn.setFillStyle(0x4cc9f0);
            this.tabRebirthBtn.setFillStyle(0x3d405b);

            // 일반 강화 활성화
            this.btnAtkUpgrade.setVisible(true); this.textAtkUpgrade.setVisible(true);
            this.btnCritUpgrade.setVisible(true); this.textCritUpgrade.setVisible(true);
            this.btnSpdUpgrade.setVisible(true); this.textSpdUpgrade.setVisible(true);

            // 영구 강화 비활성화
            this.btnPermAtkUpgrade.setVisible(false); this.textPermAtkUpgrade.setVisible(false);
            this.btnPermGoldUpgrade.setVisible(false); this.textPermGoldUpgrade.setVisible(false);

            // 버튼 텍스트
            this.textAtkUpgrade.setText(`공격력 강화 - ${getAtkCost().toLocaleString()} G`);
            this.textCritUpgrade.setText(getFinalCritRate() >= 100 ? `치명타 확률 - MAX` : `치명타 확률 강화 - ${getCritCost().toLocaleString()} G`);
            this.textSpdUpgrade.setText(getFinalAtkSpeed() <= 100 ? `공격 속도 - MAX` : `공격 속도 강화 - ${getSpdCost().toLocaleString()} G`);

        } else {
            this.tabNormalBtn.setFillStyle(0x3d405b);
            this.tabRebirthBtn.setFillStyle(0x7209b7);

            // 일반 강화 비활성화
            this.btnAtkUpgrade.setVisible(false); this.textAtkUpgrade.setVisible(false);
            this.btnCritUpgrade.setVisible(false); this.textCritUpgrade.setVisible(false);
            this.btnSpdUpgrade.setVisible(false); this.textSpdUpgrade.setVisible(false);

            // 영구 강화 활성화
            this.btnPermAtkUpgrade.setVisible(true); this.textPermAtkUpgrade.setVisible(true);
            this.btnPermGoldUpgrade.setVisible(true); this.textPermGoldUpgrade.setVisible(true);

            // 버튼 텍스트
            this.textPermAtkUpgrade.setText(`영구 공격력 (+10%) - ${getPermAtkCost()} 환생석 (Lv.${gameState.permAtkLevel})`);
            this.textPermGoldUpgrade.setText(`영구 골드 획득량 (+15%) - ${getPermGoldCost()} 환생석 (Lv.${gameState.permGoldLevel})`);
        }

        // 환생 버튼 업데이트
        const reward = getRebirthReward();
        if (reward > 0) {
            this.textRebirth.setText(`🌀 환생하기 (+${reward.toLocaleString()} 환생석)`);
            this.btnRebirth.setFillStyle(0xaa00ff);
        } else {
            this.textRebirth.setText(`🌀 환생 불가 (10 스테이지 이상부터 가능)`);
            this.btnRebirth.setFillStyle(0x555555);
        }
    }
}

// --- 3. Phaser 실행 설정 ---
const config = {
    type: Phaser.AUTO,
    width: 400,
    height: 600,
    backgroundColor: '#0d0d11',
    scene: MainScene,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    }
};

const game = new Phaser.Game(config);
</script>

</body>
</html>
