<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슬레이어 키우기 - 방치형 RPG</title>
    <!-- Phaser 3 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            user-select: none;
        }
    </style>
</head>
<body>

<script>
// --- 1. 게임 전역 데이터 (단 한 번만 선언) ---
const gameState = {
    gold: 0,
    atk: 5,                 // 기본 공격력
    atkCost: 10,            // 공격력 강화 비용
    
    critRate: 10,           // 치명타 확률 (%)
    critRateCost: 20,       // 치명타 확률 강화 비용
    critDmg: 150,           // 치명타 데미지 (%)
    
    atkSpeed: 800,          // 공격 속도 (ms)
    atkSpeedCost: 30,       // 공격 속도 강화 비용
    
    stage: 1,               // 현재 스테이지
    killCount: 0,           // 현재 스테이지 처치 수
    maxKills: 5             // 필요 처치 수
};

// --- 2. 메인 게임 씬 ---
class MainScene extends Phaser.Scene {
    constructor() {
        super({ key: 'MainScene' });
    }

    create() {
        // [1] 배경 영역
        this.add.rectangle(200, 160, 400, 320, 0x1e1e24); 
        this.add.rectangle(200, 460, 400, 280, 0x2b2d42); 

        // [2] 상단 UI 텍스트 미리 생성
        this.stageText = this.add.text(200, 20, '', { fontSize: '20px', fill: '#00e676', fontStyle: 'bold' }).setOrigin(0.5);
        this.goldText = this.add.text(20, 50, '', { fontSize: '18px', fill: '#ffd700', fontStyle: 'bold' });
        this.atkText = this.add.text(20, 80, '', { fontSize: '14px', fill: '#ffffff' });
        this.critText = this.add.text(20, 100, '', { fontSize: '14px', fill: '#ffeb3b' });
        this.spdText = this.add.text(20, 120, '', { fontSize: '14px', fill: '#00e5ff' });

        // [3] 주인공 슬레이어
        this.player = this.add.rectangle(80, 220, 35, 35, 0x29b6f6);
        this.add.text(80, 190, "슬레이어", { fontSize: '12px', fill: '#ffffff' }).setOrigin(0.5);

        // [4] 하단 업그레이드 버튼 그룹 생성
        
        // 1) 공격력 강화 버튼
        this.btnAtkUpgrade = this.add.rectangle(200, 370, 360, 45, 0xd90429).setInteractive({ useHandCursor: true });
        this.textAtkUpgrade = this.add.text(200, 370, '', { fontSize: '15px', fill: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);

        this.btnAtkUpgrade.on('pointerdown', () => {
            if (gameState.gold >= gameState.atkCost) {
                gameState.gold -= gameState.atkCost;
                gameState.atk += 2;
                gameState.atkCost = Math.floor(gameState.atkCost * 1.5);
                this.updateUI();
                this.playBtnTween(this.btnAtkUpgrade);
            }
        });

        // 2) 치명타 확률 강화 버튼
        this.btnCritUpgrade = this.add.rectangle(200, 430, 360, 45, 0xf77f00).setInteractive({ useHandCursor: true });
        this.textCritUpgrade = this.add.text(200, 430, '', { fontSize: '15px', fill: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);

        this.btnCritUpgrade.on('pointerdown', () => {
            if (gameState.critRate >= 100) return;
            if (gameState.gold >= gameState.critRateCost) {
                gameState.gold -= gameState.critRateCost;
                gameState.critRate += 1;
                gameState.critRateCost = Math.floor(gameState.critRateCost * 1.6);
                this.updateUI();
                this.playBtnTween(this.btnCritUpgrade);
            }
        });

        // 3) 공격 속도 강화 버튼
        this.btnSpdUpgrade = this.add.rectangle(200, 490, 360, 45, 0x00b4d8).setInteractive({ useHandCursor: true });
        this.textSpdUpgrade = this.add.text(200, 490, '', { fontSize: '15px', fill: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);

        this.btnSpdUpgrade.on('pointerdown', () => {
            if (gameState.atkSpeed <= 100) return;
            if (gameState.gold >= gameState.atkSpeedCost) {
                gameState.gold -= gameState.atkSpeedCost;
                gameState.atkSpeed = Math.max(100, gameState.atkSpeed - 30);
                gameState.atkSpeedCost = Math.floor(gameState.atkSpeedCost * 1.7);
                
                this.startAutoAttackTimer();
                this.updateUI();
                this.playBtnTween(this.btnSpdUpgrade);
            }
        });

        // UI 갱신 및 오토 실행
        this.updateUI();
        this.spawnMonster();
        this.startAutoAttackTimer();
    }

    // 공격 타이머 관리
    startAutoAttackTimer() {
        if (this.attackTimer) {
            this.attackTimer.destroy();
        }
        this.attackTimer = this.time.addEvent({
            delay: gameState.atkSpeed,
            callback: this.autoAttack,
            callbackScope: this,
            loop: true
        });
    }

    // 버튼 애니메이션
    playBtnTween(target) {
        this.tweens.add({
            targets: target,
            scaleX: 0.95,
            scaleY: 0.95,
            duration: 50,
            yoyo: true
        });
    }

    // 몬스터 생성
    spawnMonster() {
        const hp = gameState.stage * 15;
        this.currentMonster = {
            sprite: this.add.rectangle(280, 220, 40, 40, 0xef233c),
            hp: hp,
            maxHp: hp,
            hpText: this.add.text(280, 190, `HP: ${hp}`, { fontSize: '12px', fill: '#ff8a80' }).setOrigin(0.5)
        };
    }

    // 자동 공격
    autoAttack() {
        if (!this.currentMonster || this.currentMonster.hp <= 0) return;

        const isCrit = (Math.random() * 100) < gameState.critRate;
        let finalDamage = gameState.atk;
        
        if (isCrit) {
            finalDamage = Math.floor(gameState.atk * (gameState.critDmg / 100));
        }

        const slashColor = isCrit ? 0xffea00 : 0x00e5ff;
        const slash = this.add.rectangle(this.player.x + 20, this.player.y, 20, 6, slashColor);
        
        this.tweens.add({
            targets: slash,
            x: this.currentMonster.sprite.x,
            duration: 100,
            onComplete: () => {
                slash.destroy();
                this.damageMonster(finalDamage, isCrit);
            }
        });
    }

    // 데미지 적용
    damageMonster(amount, isCrit) {
        if (!this.currentMonster) return;

        this.currentMonster.hp -= amount;

        const dmgColor = isCrit ? '#ff1744' : '#ffeb3b';
        const dmgTextStr = isCrit ? `💥 ${amount}!` : `-${amount}`;
        const fontSize = isCrit ? '22px' : '16px';
        const offsetX = Math.floor(Math.random() * 20) - 10;

        const dmgText = this.add.text(
            this.currentMonster.sprite.x + offsetX, 
            160, 
            dmgTextStr, 
            { fontSize: fontSize, fill: dmgColor, fontStyle: 'bold' }
        ).setOrigin(0.5);

        this.tweens.add({
            targets: dmgText,
            y: 120,
            alpha: 0,
            duration: isCrit ? 600 : 400,
            onComplete: () => dmgText.destroy()
        });

        if (this.currentMonster.hp > 0) {
            this.currentMonster.hpText.setText(`HP: ${this.currentMonster.hp}`);
        } else {
            this.killMonster();
        }

        this.updateUI();
    }

    // 몬스터 처치
    killMonster() {
        gameState.gold += gameState.stage * 8;
        gameState.killCount += 1;

        if (this.currentMonster) {
            this.currentMonster.sprite.destroy();
            this.currentMonster.hpText.destroy();
            this.currentMonster = null;
        }

        if (gameState.killCount >= gameState.maxKills) {
            gameState.stage += 1;
            gameState.killCount = 0;
        }

        this.updateUI();

        this.time.delayedCall(250, () => {
            this.spawnMonster();
        });
    }

    // UI 동기화
    updateUI() {
        if (!this.textAtkUpgrade || !this.stageText) return;

        this.stageText.setText(`STAGE ${gameState.stage} (${gameState.killCount}/${gameState.maxKills})`);
        this.goldText.setText(`골드: ${gameState.gold} G`);
        this.atkText.setText(`공격력: ${gameState.atk}`);
        this.critText.setText(`치명타: ${gameState.critRate}% (데미지 ${gameState.critDmg}%)`);
        this.spdText.setText(`공격속도: ${(1000 / gameState.atkSpeed).toFixed(2)}회/초`);

        this.textAtkUpgrade.setText(`공격력 강화 (+2) - ${gameState.atkCost} G`);
        
        if (gameState.critRate >= 100) {
            this.textCritUpgrade.setText(`치명타 확률 강화 - MAX`);
        } else {
            this.textCritUpgrade.setText(`치명타 확률 (+1%) - ${gameState.critRateCost} G`);
        }

        if (gameState.atkSpeed <= 100) {
            this.textSpdUpgrade.setText(`공격 속도 강화 - MAX`);
        } else {
            this.textSpdUpgrade.setText(`공격 속도 강화 - ${gameState.atkSpeedCost} G`);
        }
    }
}

// --- 3. Phaser 실행 설정 ---
const config = {
    type: Phaser.AUTO,
    width: 400,
    height: 600,
    backgroundColor: '#0d0d11',
    scene: MainScene,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    }
};

const game = new Phaser.Game(config);
</script>

</body>
</html>
